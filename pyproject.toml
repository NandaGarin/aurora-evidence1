[project]
name = "aurora-evidence"
version = "1.0.0"
description = "AURORA module 2 — multi-source evidence retrieval, reranking, provenance, and AI detectors"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "python-multipart>=0.0.20,<1",
  "pillow>=11,<13",
  "numpy>=2,<3",
  "rfc8785>=0.1.4,<1",
  "httpx>=0.28,<1",
  "python-dotenv>=1,<2",
  "trafilatura>=1.12,<2",
  "rank-bm25>=0.2.2,<1",
]
[project.optional-dependencies]
dense = ["sentence-transformers>=3,<6", "torch>=2.6,<3"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "jsonschema>=4,<5"]

[project.scripts]
aurora-evidence = "aurora_evidence.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app", "backend/aurora_evidence"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
